<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F24A-247293 Lab 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Lab Task 3</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="card-title">My Numbers</h2>
      <p id="digits" class="digits">2 9 3</p>

      <button id="show" type="button" class="btn">Show</button>

      <div class="results">
        <div class="result-item" id="total-box">
          <span class="label">Total</span>
          <p id="total" class="value"></p>
        </div>
        <div class="result-item" id="big-box">
          <span class="label">Biggest</span>
          <p id="big" class="value"></p>
        </div>
        <div class="result-item" id="above-box">
          <span class="label">Above First</span>
          <p id="above" class="value"></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>F24A-247293-Lab Task 3</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
